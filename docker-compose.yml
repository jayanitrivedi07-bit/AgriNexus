version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  backend1:
    build: ./backend
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=1
      # Must pass FIREBASE credentials and GOOGLE_API_KEY via external env or volume in production
    depends_on:
      - redis

  backend2:
    build: ./backend
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=2
    depends_on:
      - redis

  backend3:
    build: ./backend
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=3
    depends_on:
      - redis

  load_balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
